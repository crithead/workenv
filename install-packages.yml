---
# Install Packages on RHEL / CentOS
- hosts: 
    localhost:
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ansible_playbook_python}}"
  become: yes
  tasks:
  - name: Update Packages
    ansible.builtin.dnf:
      name: '*'
      state: latest
  - name: Install EPEL Release
    ansible.builtin.dnf:
      name:
        - epel-release
      state: latest
  - name: Install packages
    ansible.builtin.dnf:
      name:
        - cmake
        - htop
        - rsync
        - tmux
        - vim
      state: latest
  - name: Remove packages
    ansible.builtin.dnf:
      name:
        - nano
      state: absent
  - name: Install extra development packages
    ansible.builtin.dnf:
      name:
        - clang-tools-extra
        - git
        - minicom
        - nmap
        - sed
        - xxd
      state: latest

